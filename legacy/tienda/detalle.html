<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Web - Detalle de producto</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="navbar"></div>

    <main class="contenedor">
        <p class="migas"><a href="../index.html">Home</a> &gt; <span id="miga-categoria"></span> &gt; <span id="miga-nombre"></span></p>
        <div id="detalle" class="tarjeta"></div>
        <section>
            <h2>Productos relacionados</h2>
            <div id="grid-relacionados" class="grid-productos"></div>
        </section>
    </main>

    <div id="footer"></div>

    <script>var BASE = "../";</script>
    <script src="../js/validaciones.js"></script>
    <script src="../js/datos.js"></script>
    <script src="../js/regiones_comunas.js"></script>
    <script src="../js/carrito.js"></script>
    <script src="../js/app.js"></script>
    <script>
        App.renderNavbar("productos");
        App.renderFooter();
        const codigo = new URLSearchParams(location.search).get("codigo");
        const producto = codigo ? buscarProducto(codigo) : null;
        const contenedor = document.getElementById("detalle");
        if (!producto) {
            contenedor.innerHTML = "<p>Producto no encontrado.</p><a class='btn btn-primario' href='productos.html'>Volver a productos</a>";
        } else {
            document.getElementById("miga-categoria").textContent = producto.categoria;
            document.getElementById("miga-nombre").textContent = producto.nombre;
            const sinStock = producto.stock === 0;
            contenedor.innerHTML =
                '<div class="detalle-grid">' +
                '<div><img class="detalle-img" src="' + App.imagenProducto(producto) + '" alt="' + App.escapar(producto.nombre) + '"></div>' +
                "<div><h1>" + App.escapar(producto.nombre) + "</h1>" +
                '<p class="producto-precio">' + App.etiquetaPrecio(producto.precio) + "</p>" +
                "<p>" + App.escapar(producto.descripcion) + "</p>" +
                "<p>" + App.insigniasProducto(producto) + "</p>" +
                '<div class="campo campo-cantidad"><label for="cantidad">Cantidad</label>' +
                '<input type="number" id="cantidad" value="1" min="1" max="' + producto.stock + '"' + (sinStock ? " disabled" : "") + "></div>" +
                '<div class="grupo-botones"><button class="btn btn-primario" type="button" id="btn-anadir"' + (sinStock ? " disabled" : "") + ">Añadir al carrito</button>" +
                '<a class="btn btn-secundario" href="productos.html">Volver</a></div></div></div>';
            document.getElementById("btn-anadir").addEventListener("click", function () {
                const cantidad = parseInt(document.getElementById("cantidad").value, 10);
                const resultado = Carrito.agregar(producto.codigo, cantidad);
                App.avisar(resultado.mensaje, resultado.exito ? "exito" : "error");
                App.actualizarInsigniaCarrito();
            });
            const relacionados = obtenerCatalogo().filter(function (p) {
                return p.categoria === producto.categoria && p.codigo !== producto.codigo;
            }).slice(0, 4);
            App.pintarCatalogo("grid-relacionados", relacionados);
        }
    </script>
</body>
</html>
