<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Web - Registro de usuario</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="navbar"></div>

    <main class="contenedor">
        <form id="form-registro" class="tarjeta formulario" novalidate>
            <h1>Registro de usuario</h1>
            <div class="campo">
                <label for="rut">RUT</label>
                <input type="text" id="rut" maxlength="12" placeholder="12.345.678-5">
                <p class="mensaje-error"></p>
            </div>
            <div class="campo">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" maxlength="100">
                <p class="mensaje-error"></p>
            </div>
            <div class="campo">
                <label for="correo">Correo</label>
                <input type="email" id="correo" maxlength="100">
                <p class="mensaje-error"></p>
            </div>
            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" maxlength="10">
                <p class="mensaje-error"></p>
            </div>
            <div class="campo">
                <label for="confirmar">Confirmar contraseña</label>
                <input type="password" id="confirmar" maxlength="10">
                <p class="mensaje-error"></p>
            </div>
            <div class="campo">
                <label for="telefono">Teléfono (opcional)</label>
                <input type="text" id="telefono" maxlength="15">
                <p class="mensaje-error"></p>
            </div>
            <div class="campo">
                <label for="region">Región</label>
                <select id="region"></select>
                <p class="mensaje-error"></p>
            </div>
            <div class="campo">
                <label for="comuna">Comuna</label>
                <select id="comuna"></select>
                <p class="mensaje-error"></p>
            </div>
            <button class="btn btn-primario" type="submit">Registrar</button>
        </form>
    </main>

    <div id="footer"></div>

    <script>var BASE = "../";</script>
    <script src="../js/validaciones.js"></script>
    <script src="../js/datos.js"></script>
    <script src="../js/regiones_comunas.js"></script>
    <script src="../js/carrito.js"></script>
    <script src="../js/app.js"></script>
    <script>
        App.renderNavbar("home");
        App.renderFooter();
        App.cargarRegiones("region", "comuna");

        function validarCampo(id) {
            const rut = App.valor("rut");
            const nombre = App.valor("nombre");
            const correo = App.valor("correo");
            const password = document.getElementById("password").value;
            const confirmar = document.getElementById("confirmar").value;
            let resultado = { valido: true, mensaje: "" };
            if (id === "rut") {
                resultado = Validaciones.validarRut(rut);
            }
            if (id === "nombre") {
                resultado = Validaciones.validarRequerido(nombre, "Nombre completo");
                if (resultado.valido) {
                    resultado = Validaciones.validarLargo(nombre, null, 100, "Nombre completo");
                }
            }
            if (id === "correo") {
                resultado = Validaciones.validarCorreo(correo);
            }
            if (id === "password") {
                resultado = Validaciones.validarContrasena(password);
            }
            if (id === "confirmar") {
                resultado = Validaciones.validarConfirmacionContrasena(password, confirmar);
            }
            if (id === "telefono") {
                resultado = Validaciones.validarTelefono(App.valor("telefono"));
            }
            if (id === "region" || id === "comuna") {
                resultado = Validaciones.validarRegionYComuna(App.valor("region"), App.valor("comuna"));
                if (!resultado.valido) {
                    App.mostrarError("region", resultado.mensaje);
                    App.mostrarError("comuna", resultado.mensaje);
                    return false;
                }
                App.limpiarError("region");
                App.limpiarError("comuna");
                return true;
            }
            if (!resultado.valido) {
                App.mostrarError(id, resultado.mensaje);
                return false;
            }
            App.limpiarError(id);
            return true;
        }

        ["rut", "nombre", "correo", "password", "confirmar", "telefono", "region", "comuna"].forEach(function (id) {
            document.getElementById(id).addEventListener("input", function () {
                validarCampo(id);
            });
            document.getElementById(id).addEventListener("change", function () {
                validarCampo(id);
            });
        });

        document.getElementById("rut").addEventListener("blur", function () {
            const valor = App.valor("rut");
            if (valor !== "" && Validaciones.validarRut(valor).valido) {
                document.getElementById("rut").value = Validaciones.formatearRut(valor);
            }
        });

        document.getElementById("form-registro").addEventListener("submit", function (e) {
            e.preventDefault();
            App.limpiarErrores("form-registro");
            const ids = ["rut", "nombre", "correo", "password", "confirmar", "telefono", "region"];
            const valido = ids.map(validarCampo).every(function (v) { return v; });
            if (!valido) {
                return;
            }
            const resultado = App.registrarUsuario({
                rut: App.valor("rut"),
                nombre: App.valor("nombre"),
                correo: App.valor("correo"),
                password: document.getElementById("password").value,
                telefono: App.valor("telefono"),
                region: App.valor("region"),
                comuna: App.valor("comuna")
            });
            if (!resultado.exito) {
                App.mostrarError(resultado.campo || "correo", resultado.mensaje);
                return;
            }
            App.avisar(resultado.mensaje, "exito");
            location.href = "../index.html";
        });
    </script>
</body>
</html>
