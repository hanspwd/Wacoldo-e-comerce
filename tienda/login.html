<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Web - Iniciar sesión</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="navbar"></div>

    <main class="contenedor">
        <form id="form-login" class="tarjeta formulario" novalidate>
            <h1>Tienda Web</h1>
            <h2>Inicio de sesión</h2>
            <div id="alerta-login"></div>
            <div class="campo">
                <label for="correo">Correo</label>
                <input type="email" id="correo" maxlength="100">
                <p class="mensaje-error"></p>
            </div>
            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" maxlength="10">
                <p class="mensaje-error"></p>
            </div>
            <button class="btn btn-primario" type="submit">Iniciar sesión</button>
            <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
        </form>
    </main>

    <div id="footer"></div>

    <script>var BASE = "../";</script>
    <script src="../js/validaciones.js"></script>
    <script src="../js/datos.js"></script>
    <script src="../js/regiones_comunas.js"></script>
    <script src="../js/carrito.js"></script>
    <script src="../js/app.js"></script>
    <script>
        App.renderNavbar("home");
        App.renderFooter();

        document.getElementById("form-login").addEventListener("submit", function (e) {
            e.preventDefault();
            App.limpiarErrores("form-login");
            const correo = App.valor("correo");
            const password = document.getElementById("password").value;
            const resultadoCorreo = Validaciones.validarCorreo(correo);
            if (!resultadoCorreo.valido) {
                App.mostrarError("correo", resultadoCorreo.mensaje);
                return;
            }
            const resultadoPass = Validaciones.validarContrasena(password);
            if (!resultadoPass.valido) {
                App.mostrarError("password", resultadoPass.mensaje);
                return;
            }
            const resultado = App.iniciarSesion(correo, password);
            if (!resultado.exito) {
                document.getElementById("alerta-login").innerHTML = '<div class="alerta alerta-error">' + resultado.mensaje + "</div>";
                return;
            }
            if (resultado.tipo === "Administrador" || resultado.tipo === "Vendedor") {
                location.href = "../admin/index.html";
            } else {
                location.href = "../index.html";
            }
        });
    </script>
</body>
</html>
